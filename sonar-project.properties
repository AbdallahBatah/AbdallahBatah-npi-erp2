# SonarQube Cloud — CI-based analysis of the whole monorepo as ONE project
# (.github/workflows/sonarcloud.yml). The project was created on SonarQube
# Cloud with Automatic Analysis, which failed on every commit; this file plus
# the workflow replace it. Automatic Analysis must be OFF on the project
# (Administration → Analysis Method) or the scanner refuses to run.
sonar.projectKey=eyad62689-lab_npi-erp
sonar.organization=eyad62689-lab
sonar.projectName=npi-erp
sonar.sourceEncoding=UTF-8

# Production code. The three apps, the two shared packages and the Prisma seed
# scripts. Generated code, fixtures and the archived documents are not code to
# review (see also the CI's eslint ignores in eslint.config.mjs).
sonar.sources=apps/api/src,apps/web/src,apps/copilot/src,packages/shared/src,packages/db/src,packages/db/prisma
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  apps/copilot/src/generated/**,\
  apps/copilot/src/npi/openapi.json,\
  packages/db/prisma/migrations/**,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Tests: next to the code in the api (*.spec.ts), under tests/ and e2e/ in the
# copilot. A path may appear in both lists because the inclusion patterns keep
# them disjoint.
sonar.tests=apps/api/src,apps/copilot/src,apps/copilot/tests,apps/copilot/e2e
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,apps/copilot/e2e/**

# TypeScript: one tsconfig per workspace so the analyzer resolves the path
# aliases (`@/…` in the copilot, `@npi/*` everywhere).
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json,apps/copilot/tsconfig.json,packages/shared/tsconfig.json,packages/db/tsconfig.json
sonar.javascript.node.maxspace=4096

# Coverage: jest lcov from the api and the copilot (the workflow rewrites the
# SF: paths to be repo-relative). The web app has no unit tests yet and the
# e2e/seed/schema files are not unit-tested by design, so they are left out of
# the coverage denominator rather than counted as 0 %.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/copilot/coverage/lcov.info
sonar.coverage.exclusions=\
  apps/web/**,\
  apps/copilot/e2e/**,\
  apps/copilot/src/app/**,\
  apps/copilot/src/components/**,\
  packages/db/prisma/**,\
  packages/db/src/**

# Duplication: generated SQL and seed data are repetitive by nature
# (apps/copilot/src/npi/types.ts, generated from openapi.json, is excluded
# from the analysis altogether above).
sonar.cpd.exclusions=packages/db/prisma/**,apps/copilot/catalog/**
