services:
  postgres:
    image: postgres:16-alpine
    container_name: npi-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: npi
      POSTGRES_PASSWORD: npi_dev_password
      POSTGRES_DB: npi_erp
    ports:
      - "5432:5432"
    volumes:
      - npi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npi -d npi_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  npi_pg_data:
