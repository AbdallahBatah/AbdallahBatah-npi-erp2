# NPI Solar ERP — production/demo stack.
#   1) cp deploy/.env.example deploy/.env   (then edit the secrets)
#   2) docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# The destructive demo-reset job lives in deploy/docker-compose.demo-reset.yml
# (deliberately NOT in this file — see the warning there). Backups:
# deploy/backup.sh + the cron line in deploy/README_AR.md.
name: npi-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: npi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: npi_erp
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npi -d npi_erp"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: npi-erp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://npi:${POSTGRES_PASSWORD}@postgres:5432/npi_erp?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # M2 attachments live on this volume — they survive rebuilds.
      UPLOADS_DIR: /app/uploads
      # Swagger/OpenAPI at /api/docs + /api/docs-json — off by default (see
      # deploy/.env.example). The demo server's deploy/.env sets this to 1.
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-0}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Hits /api/health, which verifies DB reachability — a bare TCP connect
      # cannot tell a wedged API (dead DB pool) from a healthy one.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Login-page demo-credential prefill — NEXT_PUBLIC_* is inlined at
        # build time, so this must be a build arg, not a runtime env var.
        # Off by default (see deploy/.env.example); the demo server's
        # deploy/.env sets this to 1.
        NEXT_PUBLIC_DEMO_PREFILL: ${NEXT_PUBLIC_DEMO_PREFILL:-0}
    image: npi-erp-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The rolling deploy waits on this before retiring the old container;
      # without it "web is up" would mean only that a process exists.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Madar copilot (apps/copilot, spec/madar/02 §11) — served by Caddy under
  # /copilot. Its environment is its own: no env_file, no DATABASE_URL, no
  # JWT secret — it reaches NPI only over HTTP as the signed-in user
  # (NPI_API_BASE) and owns the separate database npi_copilot on the same
  # Postgres container (created on the first boot by `prisma migrate deploy`).
  copilot:
    build:
      context: .
      dockerfile: apps/copilot/Dockerfile
    image: npi-erp-copilot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COPILOT_DATABASE_URL: postgresql://npi:${POSTGRES_PASSWORD}@postgres:5432/npi_copilot?schema=public
      NPI_API_BASE: http://api:4000/api
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in deploy/.env}
      MADAR_PROVIDER: anthropic
      COPILOT_MODEL_ECONOMY: ${COPILOT_MODEL_ECONOMY:-claude-haiku-4-5-20251001}
      COPILOT_MODEL_ADVANCED: ${COPILOT_MODEL_ADVANCED:-claude-sonnet-5}
      # 32 bytes hex (openssl rand -hex 32): encrypts the stored NPI token at rest.
      COPILOT_SESSION_KEY: ${COPILOT_SESSION_KEY:?set COPILOT_SESSION_KEY in deploy/.env}
      # Uploaded documents — on the copilot_docs volume, so they survive rebuilds.
      COPILOT_DOCS_DIR: /data/copilot_docs
      COPILOT_DAILY_TOKEN_CAP: ${COPILOT_DAILY_TOKEN_CAP:-600000}
      # NEXT_PUBLIC_NPI_WEB_URL is deliberately unset: behind Caddy the copilot
      # and NPI's web share one origin, so links to NPI stay relative.
    volumes:
      - copilot_docs:/data/copilot_docs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # /copilot/api/health answers 200 only when npi_copilot answers (the
      # same rule as the api's probe); the rolling deploy waits on this.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3100/copilot/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - copilot

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  uploads_data:
  copilot_docs:
